name: Signal application baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify F# baseline
        run: |
          dotnet build src/Echelon.Signal.Host.Wasm/Echelon.Signal.Host.Wasm.fsproj --nologo
          dotnet run --project tests/Echelon.Signal.Tests/Echelon.Signal.Tests.fsproj --configuration Release
      - name: Verify Limen
        run: npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.2 verify --strict
