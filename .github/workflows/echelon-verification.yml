name: Echelon Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echelon-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Praxis Ordo Limen and repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_DIR: /tmp/echelon-evidence

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
        continue-on-error: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
        continue-on-error: true

      - name: Capture baseline
        shell: bash
        run: |
          set -u
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "node=$(node --version 2>/dev/null || echo unavailable)"
            echo "npm=$(npm --version 2>/dev/null || echo unavailable)"
            echo "dotnet=$(dotnet --version 2>/dev/null || echo unavailable)"
          } | tee $EVIDENCE_DIR/environment.txt

          git status --short | tee $EVIDENCE_DIR/git-status-before.txt
          git ls-files | sort > $EVIDENCE_DIR/tracked-files.txt

          {
            echo "=== .NET entry points ==="
            find . -type f \( -name '*.sln' -o -name '*.slnx' -o -name '*.fsproj' -o -name '*.csproj' \) -not -path './.git/*' | sort
            echo "=== Node manifests ==="
            find . -type f \( -name 'package.json' -o -name 'package-lock.json' \) -not -path './.git/*' | sort
            echo "=== Echelon manifests ==="
            find . -maxdepth 3 -type f \( -path './.echelon/*' -o -name 'ros.json' -o -name 'sde.config.json' -o -name 'limen.config.json' \) | sort
          } | tee $EVIDENCE_DIR/entry-points.txt

      - name: Repository whitespace check
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          set +e
          git diff --check > $EVIDENCE_DIR/git-diff-check.txt 2>&1
          code=$?
          echo "$code" > $EVIDENCE_DIR/git-diff-check.exit
          cat $EVIDENCE_DIR/git-diff-check.txt
          exit 0

      - name: Repository Praxis validation
        shell: bash
        run: |
          set +e
          if [ ! -f ./ros ]; then
            echo "UNAVAILABLE: ./ros launcher is absent" | tee $EVIDENCE_DIR/legacy-ros.txt
            echo "127" > $EVIDENCE_DIR/legacy-ros-status.exit
            echo "127" > $EVIDENCE_DIR/legacy-ros-registry-check.exit
            echo "127" > $EVIDENCE_DIR/legacy-ros-registry-build.exit
            echo "127" > $EVIDENCE_DIR/legacy-ros-validate.exit
            exit 0
          fi

          chmod +x ./ros

          ./ros status > $EVIDENCE_DIR/legacy-ros-status.txt 2>&1
          echo "$?" > $EVIDENCE_DIR/legacy-ros-status.exit
          cat $EVIDENCE_DIR/legacy-ros-status.txt

          ./ros registry check > $EVIDENCE_DIR/legacy-ros-registry-check.txt 2>&1
          echo "$?" > $EVIDENCE_DIR/legacy-ros-registry-check.exit
          cat $EVIDENCE_DIR/legacy-ros-registry-check.txt

          ./ros registry build > $EVIDENCE_DIR/legacy-ros-registry-build.txt 2>&1
          echo "$?" > $EVIDENCE_DIR/legacy-ros-registry-build.exit
          cat $EVIDENCE_DIR/legacy-ros-registry-build.txt

          ./ros validate --json > $EVIDENCE_DIR/legacy-ros-validate.json 2> $EVIDENCE_DIR/legacy-ros-validate.stderr
          echo "$?" > $EVIDENCE_DIR/legacy-ros-validate.exit
          cat $EVIDENCE_DIR/legacy-ros-validate.stderr
          cat $EVIDENCE_DIR/legacy-ros-validate.json

          exit 0

      # ./praxis runs the Praxis release this repository pins
      # (.echelon/ros.json), installing it on first use with only a POSIX
      # shell and curl. That release also carries the `echelon` installer,
      # which installs the Ordo release pinned in .echelon/toolchain.json.
      - name: Current Praxis 3.7.1 verification and upgrade plan
        shell: bash
        run: |
          set +e
          ./praxis --version > $EVIDENCE_DIR/praxis-current-version.txt 2>&1
          echo "$?" > $EVIDENCE_DIR/praxis-current-version.exit
          cat $EVIDENCE_DIR/praxis-current-version.txt

          ./praxis status --json > $EVIDENCE_DIR/praxis-current-status.json 2> $EVIDENCE_DIR/praxis-current-status.stderr
          echo "$?" > $EVIDENCE_DIR/praxis-current-status.exit
          cat $EVIDENCE_DIR/praxis-current-status.stderr
          cat $EVIDENCE_DIR/praxis-current-status.json

          ./praxis upgrade --dry-run --json > $EVIDENCE_DIR/praxis-upgrade-plan.json 2> $EVIDENCE_DIR/praxis-upgrade-plan.stderr
          echo "$?" > $EVIDENCE_DIR/praxis-upgrade-plan.exit
          cat $EVIDENCE_DIR/praxis-upgrade-plan.stderr
          cat $EVIDENCE_DIR/praxis-upgrade-plan.json

          ./praxis verify --strict --json > $EVIDENCE_DIR/praxis-current-verify.json 2> $EVIDENCE_DIR/praxis-current-verify.stderr
          echo "$?" > $EVIDENCE_DIR/praxis-current-verify.exit
          cat $EVIDENCE_DIR/praxis-current-verify.stderr
          cat $EVIDENCE_DIR/praxis-current-verify.json

          exit 0

      - name: Ordo 1.4.0 verification
        shell: bash
        run: |
          set +e
          ORDO_VERSION="$(sed -n 's/.*"ordo"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .echelon/toolchain.json | head -n 1)"
          PRAXIS_VERSION="$(./praxis --version | sed -n 's/^praxis //p')"
          ECHELON="${ECHELON_HOME:-$HOME/.echelon}/tools/praxis/$PRAXIS_VERSION/echelon"
          ORDO="${ECHELON_HOME:-$HOME/.echelon}/bin/ordo"

          "$ECHELON" install ordo "$ORDO_VERSION" > $EVIDENCE_DIR/ordo-install.txt 2>&1
          echo "$?" > $EVIDENCE_DIR/ordo-install.exit
          cat $EVIDENCE_DIR/ordo-install.txt

          "$ORDO" --version > $EVIDENCE_DIR/ordo-version.txt 2>&1
          echo "$?" > $EVIDENCE_DIR/ordo-version.exit
          cat $EVIDENCE_DIR/ordo-version.txt

          "$ORDO" status --json > $EVIDENCE_DIR/ordo-status.json 2> $EVIDENCE_DIR/ordo-status.stderr
          echo "$?" > $EVIDENCE_DIR/ordo-status.exit
          cat $EVIDENCE_DIR/ordo-status.stderr
          cat $EVIDENCE_DIR/ordo-status.json

          "$ORDO" init --dry-run --json > $EVIDENCE_DIR/ordo-init-plan.json 2> $EVIDENCE_DIR/ordo-init-plan.stderr
          echo "$?" > $EVIDENCE_DIR/ordo-init-plan.exit
          cat $EVIDENCE_DIR/ordo-init-plan.stderr
          cat $EVIDENCE_DIR/ordo-init-plan.json

          "$ORDO" verify --strict --json > $EVIDENCE_DIR/ordo-verify.json 2> $EVIDENCE_DIR/ordo-verify.stderr
          echo "$?" > $EVIDENCE_DIR/ordo-verify.exit
          cat $EVIDENCE_DIR/ordo-verify.stderr
          cat $EVIDENCE_DIR/ordo-verify.json

          exit 0

      - name: Limen 0.7.1 verification
        shell: bash
        run: |
          set +e
          PKG="@echelon-foundry/limen@0.7.1"

          npx --yes --package="$PKG" limen --version > $EVIDENCE_DIR/limen-version.txt 2>&1
          echo "$?" > $EVIDENCE_DIR/limen-version.exit
          cat $EVIDENCE_DIR/limen-version.txt

          npx --yes --package="$PKG" limen status --json > $EVIDENCE_DIR/limen-status.json 2> $EVIDENCE_DIR/limen-status.stderr
          echo "$?" > $EVIDENCE_DIR/limen-status.exit
          cat $EVIDENCE_DIR/limen-status.stderr
          cat $EVIDENCE_DIR/limen-status.json

          npx --yes --package="$PKG" limen init --dry-run --json > $EVIDENCE_DIR/limen-init-plan.json 2> $EVIDENCE_DIR/limen-init-plan.stderr
          echo "$?" > $EVIDENCE_DIR/limen-init-plan.exit
          cat $EVIDENCE_DIR/limen-init-plan.stderr
          cat $EVIDENCE_DIR/limen-init-plan.json

          npx --yes --package="$PKG" limen verify --strict --json > $EVIDENCE_DIR/limen-verify.json 2> $EVIDENCE_DIR/limen-verify.stderr
          echo "$?" > $EVIDENCE_DIR/limen-verify.exit
          cat $EVIDENCE_DIR/limen-verify.stderr
          cat $EVIDENCE_DIR/limen-verify.json

          exit 0

      # Runs before the .NET step: the .NET foundations conformance tests read
      # the installed npm foundations (Forma, Folio, Limen), so they must be
      # installed first, as build.yml does.
      - name: Build and test Node application when present
        shell: bash
        run: |
          set +e
          if [ ! -f package.json ]; then
            echo "UNAVAILABLE: no root package.json exists yet" | tee $EVIDENCE_DIR/node-application.txt
            echo "0" > $EVIDENCE_DIR/node-install.exit
            echo "0" > $EVIDENCE_DIR/node-test.exit
            echo "not-present" > $EVIDENCE_DIR/node.state
            exit 0
          fi

          echo "present" > $EVIDENCE_DIR/node.state

          if [ -f package-lock.json ]; then
            npm ci > $EVIDENCE_DIR/node-install.txt 2>&1
          else
            npm install --ignore-scripts > $EVIDENCE_DIR/node-install.txt 2>&1
          fi
          echo "$?" > $EVIDENCE_DIR/node-install.exit
          cat $EVIDENCE_DIR/node-install.txt

          npm test > $EVIDENCE_DIR/node-test.txt 2>&1
          echo "$?" > $EVIDENCE_DIR/node-test.exit
          cat $EVIDENCE_DIR/node-test.txt

          exit 0

      - name: Build and test .NET when present
        shell: bash
        run: |
          set +e
          mapfile -t solutions < <(find . -maxdepth 4 -type f \( -name '*.sln' -o -name '*.slnx' \) -not -path './.git/*' | sort)
          mapfile -t projects < <(find . -maxdepth 5 -type f \( -name '*.fsproj' -o -name '*.csproj' \) -not -path './.git/*' | sort)

          if [ "${#solutions[@]}" -eq 0 ] && [ "${#projects[@]}" -eq 0 ]; then
            echo "UNAVAILABLE: no .NET solution/project exists yet" | tee $EVIDENCE_DIR/dotnet.txt
            echo "0" > $EVIDENCE_DIR/dotnet-build.exit
            echo "0" > $EVIDENCE_DIR/dotnet-test.exit
            echo "not-present" > $EVIDENCE_DIR/dotnet.state
            exit 0
          fi

          echo "present" > $EVIDENCE_DIR/dotnet.state
          target=""
          if [ "${#solutions[@]}" -gt 0 ]; then
            target="${solutions[0]}"
          else
            target="${projects[0]}"
          fi
          echo "target=$target" | tee $EVIDENCE_DIR/dotnet-target.txt

          dotnet build "$target" --configuration Release --nologo > $EVIDENCE_DIR/dotnet-build.txt 2>&1
          echo "$?" > $EVIDENCE_DIR/dotnet-build.exit
          cat $EVIDENCE_DIR/dotnet-build.txt

          dotnet test "$target" --configuration Release --no-build --nologo > $EVIDENCE_DIR/dotnet-test.txt 2>&1
          echo "$?" > $EVIDENCE_DIR/dotnet-test.exit
          cat $EVIDENCE_DIR/dotnet-test.txt

          exit 0

      - name: Detect generated or unexpected repository drift
        shell: bash
        run: |
          set +e
          git diff --check > $EVIDENCE_DIR/git-diff-check-after.txt 2>&1
          echo "$?" > $EVIDENCE_DIR/git-diff-check-after.exit

          git status --short > $EVIDENCE_DIR/git-status-after.txt
          cat $EVIDENCE_DIR/git-status-after.txt

          if [ -s $EVIDENCE_DIR/git-status-after.txt ]; then
            echo "1" > $EVIDENCE_DIR/git-clean.exit
            git diff > $EVIDENCE_DIR/repository-drift.diff
          else
            echo "0" > $EVIDENCE_DIR/git-clean.exit
            : > $EVIDENCE_DIR/repository-drift.diff
          fi

          exit 0

      - name: Write verification summary
        if: always()
        shell: bash
        run: |
          set -u
          read_code() {
            if [ -f "$EVIDENCE_DIR/$1.exit" ]; then
              cat "$EVIDENCE_DIR/$1.exit"
            else
              echo "missing"
            fi
          }

          {
            echo "# Echelon verification"
            echo
            echo "| Check | Exit/result |"
            echo "|---|---:|"
            echo "| git diff --check (before) | $(read_code git-diff-check) |"
            echo "| legacy ROS status | $(read_code legacy-ros-status) |"
            echo "| legacy ROS registry check | $(read_code legacy-ros-registry-check) |"
            echo "| legacy ROS registry build | $(read_code legacy-ros-registry-build) |"
            echo "| legacy ROS validate | $(read_code legacy-ros-validate) |"
            echo "| Praxis 3.7.1 version probe | $(read_code praxis-current-version) |"
            echo "| Praxis 3.7.1 status | $(read_code praxis-current-status) |"
            echo "| Praxis 3.7.1 upgrade dry-run | $(read_code praxis-upgrade-plan) |"
            echo "| Praxis 3.7.1 verify strict | $(read_code praxis-current-verify) |"
            echo "| Ordo 1.4.0 install | $(read_code ordo-install) |"
            echo "| Ordo 1.4.0 status | $(read_code ordo-status) |"
            echo "| Ordo 1.4.0 init dry-run | $(read_code ordo-init-plan) |"
            echo "| Ordo 1.4.0 verify strict | $(read_code ordo-verify) |"
            echo "| Limen 0.7.1 status | $(read_code limen-status) |"
            echo "| Limen 0.7.1 init dry-run | $(read_code limen-init-plan) |"
            echo "| Limen 0.7.1 verify strict | $(read_code limen-verify) |"
            echo "| .NET build | $(read_code dotnet-build) |"
            echo "| .NET test | $(read_code dotnet-test) |"
            echo "| Node install | $(read_code node-install) |"
            echo "| Node test | $(read_code node-test) |"
            echo "| git diff --check (after) | $(read_code git-diff-check-after) |"
            echo "| working tree clean after checks | $(read_code git-clean) |"
            echo
            echo "A missing framework installation is a failed required capability, not a pass."
            echo "Absent application build entry points are recorded as not-present until implementation begins."
          } | tee $EVIDENCE_DIR/summary.md

          cat $EVIDENCE_DIR/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echelon-verification-evidence
          path: /tmp/echelon-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce verification gate
        if: always()
        shell: bash
        run: |
          set -u
          failures=0

          require_zero() {
            name="$1"
            file="$EVIDENCE_DIR/$2.exit"
            if [ ! -f "$file" ]; then
              echo "::error::$name did not produce an exit record"
              failures=$((failures + 1))
              return
            fi
            code="$(cat "$file")"
            if [ "$code" != "0" ]; then
              echo "::error::$name failed with exit $code"
              failures=$((failures + 1))
            fi
          }

          require_zero "Repository whitespace check" "git-diff-check"
          require_zero "Repository Praxis validation" "legacy-ros-validate"
          require_zero "Current Praxis strict verification" "praxis-current-verify"
          require_zero "Ordo strict verification" "ordo-verify"
          require_zero "Limen strict verification" "limen-verify"
          require_zero ".NET build when present" "dotnet-build"
          require_zero ".NET tests when present" "dotnet-test"
          require_zero "Node install when present" "node-install"
          require_zero "Node tests when present" "node-test"
          require_zero "Repository whitespace check after tooling" "git-diff-check-after"
          require_zero "Clean working tree after verification" "git-clean"

          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures required verification gate(s) failed. See the uploaded evidence artifact and step summary."
            exit 1
          fi

          echo "All required verification gates passed."
