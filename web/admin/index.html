<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signal · Administration</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="./admin.css" />
</head>
<body>
<!-- Structure and presentation only (ADM-035). Every value is projected by
     the F# engine (src/Echelon.Signal.Admin/AdminView.fs) through Limen's
     data-* bindings, every control sends a named event back to it, and every
     action is enabled only when the engine's capabilities allow it. No
     personal data appears: administrators are GitHub account numbers, groups
     and contributions opaque ids and hashes (ADM-001). -->
<main class="admin ef-stack">
  <header class="ef-record-header page-header">
    <div class="ef-record-header__main">
      <div class="ef-record-header__title">
        <div><span class="ef-record-header__type">Signal</span><h1>Administration</h1></div>
      </div>
      <p id="principal" data-text="principal"></p>
    </div>
    <!-- Every view's address is its state (SIG-LINK-001); this copies it. -->
    <div class="ef-record-header__actions">
      <button type="button" class="ef-button" id="copy-link" data-event="copyLink">Copy link</button>
    </div>
  </header>

  <!-- Relative links from the engine's route codec (SIG-LINK-002). -->
  <nav class="ef-navigation-shell" id="areas" aria-label="Administration">
    <ul class="areas">
      <template data-each="areas" data-key="href">
        <li><a data-bind-href="href" data-bind-aria-current="current" data-text="label"></a></li>
      </template>
    </ul>
  </nav>

  <!-- A link that names nothing has its own page (SIG-LINK-007). -->
  <template data-if="hasProblem">
    <section id="route-problem" class="ef-stack" role="alert" aria-labelledby="route-problem-title">
      <h2 id="route-problem-title" data-text="problemTitle"></h2>
      <p id="route-problem-message" data-text="problemMessage"></p>
      <p><a id="route-problem-home" data-bind-href="homeHref">Go to the overview</a></p>
    </section>
  </template>

  <!-- Assessments: public, no sign-in or dataset needed (DF-SIGNAL-2026-0003 §8). -->
  <template data-if="viewReports">
    <section id="reports" class="ef-stack" aria-labelledby="reports-title">
      <h2 id="reports-title">Report definitions</h2>
      <p class="ef-field__description">A report definition chooses what a report shows and how; it never changes how results are scored. A version used for a formal snapshot never changes: editing it saves the next version.</p>
      <template data-if="hasBuilderProblem"><p class="ef-alert" role="alert" data-tone="attention" data-text="builderProblem"></p></template>
      <ul id="saved-definitions">
        <template data-each="savedDefinitions" data-key="key"><li><span data-text="label"></span> <button type="button" class="ef-button" data-event="editReportDefinition">Open</button></li></template>
      </ul>
      <template data-if="canBuildReports">
        <form id="new-definition" class="ef-stack" data-event="newReportDefinition">
          <label>New definition id (lowercase letters, digits, hyphens) <input type="text" data-event="newReportId" data-bind-value="newReportId" /></label>
          <button type="submit" class="ef-button" data-bind-disabled="busy">Start a definition</button>
        </form>
      </template>
      <template data-if="hasBuilder">
        <section id="builder" class="ef-stack" aria-labelledby="builder-heading">
          <h3 id="builder-heading" data-text="builderHeading"></h3>
          <template data-if="builderUnsaved"><p><strong>Unsaved changes</strong></p></template>
          <label>Audience
            <select data-event="reportAudience"><template data-each="builderAudiences" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template></select>
          </label>
          <label>Detail
            <select data-event="reportDetail"><template data-each="builderDetails" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template></select>
          </label>
          <label>Template
            <select data-event="reportPin"><template data-each="builderPins" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template></select>
          </label>
          <fieldset class="ef-choice-group">
            <legend>Blocks, in reading order</legend>
            <ol id="builder-blocks">
              <template data-each="builderBlocks" data-key="key">
                <li><label><input type="checkbox" data-event="reportBlock" data-bind-value="key" data-bind-checked="checked" /> <span data-text="label"></span></label> <button type="button" class="ef-button" data-event="reportBlockUp">Move up</button></li>
              </template>
            </ol>
          </fieldset>
          <label>Minimum group size <input type="number" min="1" data-event="reportMinimum" data-bind-value="builderMinimum" /></label>
          <label>Decimal places <input type="number" min="0" max="6" data-event="reportDecimals" data-bind-value="builderDecimals" /></label>
          <label>Highlights <input type="number" min="0" max="20" data-event="reportHighlights" data-bind-value="builderHighlights" /></label>
          <label>Check and preview with
            <select data-event="reportPreviewGroup"><template data-each="builderGroups" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template></select>
          </label>
          <ul id="builder-checks"><template data-each="builderChecks" data-key="key"><li data-text="text"></li></template></ul>
          <ul id="builder-preview"><template data-each="builderPreview" data-key="key"><li data-text="text"></li></template></ul>
          <template data-if="canBuildReports"><button type="button" class="ef-button" data-event="saveReportDefinition" data-bind-disabled="busy">Save definition</button></template>
        </section>
      </template>
    </section>
  </template>
  <template data-if="viewDraft">
    <section id="draft" class="ef-stack" aria-labelledby="draft-heading">
      <template data-if="hasAuthoringProblem"><p class="ef-alert" role="alert" data-tone="attention" data-text="authoringProblem"></p></template>
      <template data-if="hasDraft">
        <h2 id="draft-heading" data-text="draftHeading"></h2>
        <p><span data-text="draftParent"></span><template data-if="draftUnsaved"> · <strong>Unsaved changes</strong></template></p>
        <label>Title <input type="text" data-event="draftTitle" data-bind-value="draftTitle" /></label>
        <label>Description <textarea rows="2" data-event="draftDescription" data-bind-value="draftDescription"></textarea></label>
        <h3>Sections</h3>
        <ol id="draft-sections">
          <template data-each="draftSections" data-key="id">
            <li>
              <span data-text="id"></span> <span data-text="title"></span> (<span data-text="questionCount"></span> questions)
              <button type="button" class="ef-button" data-event="addQuestion">Add the question below here</button>
              <button type="button" class="ef-button" data-event="removeSection">Remove section</button>
            </li>
          </template>
        </ol>
        <label>New section title <input type="text" data-event="newSectionTitle" data-bind-value="newSectionTitle" /></label>
        <button type="button" class="ef-button" data-event="addSection">Add section</button>
        <label>New question <input type="text" data-event="newQuestionPrompt" data-bind-value="newQuestionPrompt" /></label>
        <label>Kind <select id="question-kind" data-event="newQuestionKind"><template data-each="questionKinds" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template></select></label>
        <label>Details <input id="question-details" type="text" data-event="newQuestionDetails" data-bind-value="newQuestionDetails" /></label>
        <p class="ef-field__description" data-text="questionDetailsHint"></p>
        <h3>Questions</h3>
        <ol id="draft-questions">
          <template data-each="draftQuestions" data-key="id">
            <li><span data-text="section"></span> · <span data-text="id"></span>: <span data-text="prompt"></span> (<span data-text="kind"></span>) <button type="button" class="ef-button" data-event="removeQuestion">Remove</button></li>
          </template>
        </ol>
        <h3>Conditions</h3>
        <ul id="draft-rules">
          <template data-each="draftRules" data-key="id">
            <li><span data-text="label"></span> <button type="button" class="ef-button" data-event="removeRule">Remove</button></li>
          </template>
        </ul>
        <label>Show question <input id="rule-question" type="text" data-event="ruleQuestion" data-bind-value="ruleQuestion" /></label>
        <label>only when question <input id="rule-when" type="text" data-event="ruleWhen" data-bind-value="ruleWhen" /></label>
        <label>has the answer <input id="rule-answer" type="text" data-event="ruleAnswer" data-bind-value="ruleAnswer" /></label>
        <button type="button" class="ef-button" data-event="addShowRule">Add condition</button>
        <h3>Test fixtures</h3>
        <ul id="draft-fixtures"><template data-each="draftFixtures" data-key="id"><li data-text="name"></li></template></ul>
        <button type="button" class="ef-button" data-event="addFixture">Add a fixture: every answer at the midpoint</button>
        <h3>Validation</h3>
        <table id="draft-findings">
          <thead><tr><th scope="col">Severity</th><th scope="col">Code</th><th scope="col">Finding</th></tr></thead>
          <tbody><template data-each="draftFindings" data-key="key"><tr><td data-text="severity"></td><td data-text="code"></td><td data-text="message"></td></tr></template></tbody>
        </table>
        <p id="draft-preview" data-text="draftPreview"></p>
        <template data-if="draftHasWarnings"><label><input type="checkbox" data-event="acknowledgeWarnings" value="true" data-bind-checked="acknowledgeWarnings" /> I have read the warnings and accept them</label></template>
        <template data-if="canEditDrafts"><button type="button" class="ef-button" data-event="saveDraft" data-bind-disabled="busy">Save draft</button></template>
        <h3>Review</h3>
        <p id="draft-review" data-text="draftReview"></p>
        <template data-if="canRequestReview"><button type="button" class="ef-button" data-event="requestReview" data-bind-disabled="busy">Submit for review</button></template>
        <template data-if="canApproveReview"><button type="button" class="ef-button" data-event="approveReview" data-bind-disabled="busy">Approve as reviewed</button></template>
        <template data-if="canPublishTemplates"><button type="button" class="ef-button" data-event="publishDraft" data-bind-disabled="busy">Publish</button></template>
      </template>
      <template data-if="hasNoDraft"><p>There is no draft of <span data-text="draftSurvey"></span>. Start one or derive one from a published version under Assessments.</p></template>
    </section>
  </template>
  <template data-if="viewAssessments">
    <section id="assessments" class="ef-stack" aria-labelledby="assessments-title">
      <h2 id="assessments-title">Assessments</h2>
      <ul id="catalog-assessments">
        <template data-each="catalogAssessments" data-key="href"><li><a data-bind-href="href" data-text="label"></a></li></template>
      </ul>
      <template data-if="canEditDrafts">
        <form id="new-draft" class="ef-stack" data-event="startDraft">
          <h3>Start a survey</h3>
          <label>Survey identifier <input type="text" data-event="newDraftSurvey" data-bind-value="newDraftSurvey" /></label>
          <label>Title <input type="text" data-event="newDraftTitle" data-bind-value="newDraftTitle" /></label>
          <button type="submit" class="ef-button" data-bind-disabled="busy">Start draft</button>
        </form>
      </template>
      <template data-if="hasAuthoringProblem"><p id="authoring-problem" class="ef-alert" role="alert" data-tone="attention" data-text="authoringProblem"></p></template>
      <template data-if="hasStoredTemplates">
        <section id="stored-templates" class="ef-stack" aria-labelledby="stored-templates-title">
          <h3 id="stored-templates-title">Published in this dataset</h3>
          <ul id="template-versions">
            <template data-each="templateVersions" data-key="key">
              <li><span data-text="label"></span> · <span data-text="status"></span> · <span data-text="groups"></span>
                <button type="button" class="ef-button" data-event="downloadSiteFile" data-bind-disabled="busy">For the respondent site</button>
                <button type="button" class="ef-button" data-event="testLinks">Test links</button></li>
            </template>
          </ul>
          <template data-if="hasTestLinks">
            <section id="test-links" class="ef-stack" aria-labelledby="test-links-title">
              <h4 id="test-links-title" data-text="testLinksTitle"></h4>
              <p class="ef-field__description">Each link opens the survey page marked as a test, so you can try this version on a phone, in another browser or by email. What it submits is marked as a test, and a production import refuses it. The version's file must be on the respondent site first.</p>
              <ul>
                <template data-each="testLinks" data-key="key">
                  <li><a data-bind-href="href" data-text="label" target="_blank" rel="noopener noreferrer"></a></li>
                </template>
              </ul>
            </section>
          </template>
          <p id="site-file-help" class="ef-field__description">Respondents' links open the survey from the respondent site, which reads each published version from its own copy. "For the respondent site" saves that copy, named for the version; commit it unchanged to the site repository's published-templates/ folder. The survey page refuses a copy that has been changed.</p>
          <ul id="template-actions">
            <template data-each="templateActions" data-key="key">
              <li>
                <span data-text="label"></span>
                <template data-if="canDerive"><button type="button" class="ef-button" data-event="deriveDraft" data-bind-disabled="busy">Derive a draft</button></template>
                <template data-if="canHide"><button type="button" class="ef-button" data-event="hideVersion" data-bind-disabled="busy">Hide from new groups</button></template>
              </li>
            </template>
          </ul>
          <ul id="template-drafts">
            <template data-each="draftLinks" data-key="key"><li><a data-bind-href="href" data-text="label"></a></li></template>
          </ul>
        </section>
      </template>
      <template data-if="hasAssessment">
        <section id="assessment" class="ef-stack">
          <h3><a id="assessment-title" data-bind-href="assessmentHref" data-text="assessmentTitle"></a></h3>
          <nav aria-label="Sections">
            <ul id="assessment-sections">
              <template data-each="assessmentSections" data-key="id">
                <li><a data-bind-href="href" data-bind-aria-current="current"><span data-text="id"></span> <span data-text="label"></span></a></li>
              </template>
            </ul>
          </nav>
          <template data-if="hasSection">
            <section id="section" class="ef-stack">
              <h4 id="section-label" data-text="sectionLabel"></h4>
              <ol id="section-questions">
                <template data-each="sectionQuestions" data-key="id">
                  <li><a data-bind-href="href" data-bind-aria-current="current"><span data-text="id"></span>: <span data-text="prompt"></span></a></li>
                </template>
              </ol>
            </section>
          </template>
          <template data-if="hasQuestion">
            <section id="question" class="ef-stack" aria-label="Question">
              <p><strong id="question-id" data-text="questionId"></strong></p>
              <blockquote id="question-prompt" data-text="questionPrompt"></blockquote>
              <p>Answered on a five-point frequency scale, with "don't know", "not observed" and "not applicable", which are not counted as zero.</p>
            </section>
          </template>
        </section>
      </template>
    </section>
  </template>

  <template data-if="hasOperationalFault">
    <aside class="ef-fault ef-fault--inline" id="operational-fault" role="alert">
      <p class="ef-fault__title"><strong data-text="operationalFaultTitle"></strong></p>
      <p class="ef-fault__message" data-text="operationalFaultMessage"></p>
      <p class="ef-fault-reference">Reference <code data-text="operationalFaultReference"></code></p>
    </aside>
  </template>

  <!-- Domain refusals and infrastructure notices: a sentence, with the stable
       code as technical detail (ADM-031). -->
  <template data-if="hasNotice">
    <aside id="notice" class="ef-alert" role="status" data-tone="attention">
      <p id="notice-message" data-text="notice"></p>
      <details><summary>Technical detail</summary><code id="notice-code" data-text="noticeCode"></code></details>
      <button type="button" class="ef-button" data-event="dismissNotice">Dismiss</button>
    </aside>
  </template>

  <template data-if="screenLoading">
    <p id="loading" role="status">Loading the deployment's configuration…</p>
  </template>

  <template data-if="screenMisconfigured">
    <section id="misconfigured" class="ef-stack" role="alert">
      <h2>This deployment is not configured correctly</h2>
      <p data-text="configurationProblem"></p>
    </section>
  </template>

  <template data-if="screenUnconfigured">
    <section id="unconfigured" class="ef-stack">
      <h2>No data store is configured</h2>
      <p>This deployment configures no storage profile, so there is nothing to administer. Configure a profile, an identity exchange and a dataset in <code>signal.deployment.json</code>.</p>
    </section>
  </template>

  <template data-if="screenSignIn">
    <section id="sign-in" class="ef-stack" aria-labelledby="sign-in-title">
      <h2 id="sign-in-title">Sign in with GitHub</h2>
      <form class="ef-stack" data-event="signIn">
        <fieldset class="ef-choice-group">
          <legend>Keep me signed in</legend>
          <label><input type="radio" name="retention" value="page" id="retention-page" data-event="retention" data-bind-checked="retentionPage" /> On this page only</label>
          <label><input type="radio" name="retention" value="tab" id="retention-tab" data-event="retention" data-bind-checked="retentionTab" /> In this tab until I close it</label>
        </fieldset>
        <p id="retention-disclosure" data-text="retentionDisclosure"></p>
        <button type="submit" class="ef-button" id="sign-in-button" data-bind-disabled="signInBusy">Sign in</button>
      </form>
    </section>
  </template>

  <template data-if="screenDatasets">
    <section id="datasets" class="ef-stack">
      <h2>Datasets</h2>
      <ul>
        <template data-each="datasets" data-key="id">
          <li><button type="button" class="ef-button" data-event="openDataset" data-text="label"></button></li>
        </template>
      </ul>
      <button type="button" class="ef-button" data-event="signOut">Sign out</button>
    </section>
  </template>

  <template data-if="screenDataset">
    <section id="dataset" class="ef-stack">
      <!-- Status: credential, read-only and offline state (ADM-033, ADM-056, ADM-070). -->
      <div id="status" class="ef-operation-status" role="status">
        <p><strong data-text="datasetLabel"></strong> · <span id="credential" data-text="credential"></span></p>
        <template data-if="readOnly"><p id="read-only">Read-only. <span data-text="readOnlyReasons"></span></p></template>
        <template data-if="offline"><p id="offline">Offline: what is shown was last verified <span data-text="lastVerified"></span> and may be out of date. Changes are unavailable and nothing is queued.</p></template>
        <button type="button" class="ef-button" data-event="refresh" data-bind-disabled="busy">Refresh</button>
        <button type="button" class="ef-button" data-event="signOut">Sign out</button>
      </div>

      <template data-if="viewOverview">
        <section id="overview" class="ef-stack">
          <h2>Overview</h2>
          <p><span data-text="groupsWaiting"></span> group(s) waiting for imports · <span data-text="groupsComplete"></span> complete</p>
          <h3>Unresolved work</h3>
          <ul id="obligations">
            <template data-each="obligations" data-key="code"><li data-text="text"></li></template>
          </ul>
        </section>
      </template>

      <template data-if="viewGroups">
        <section id="groups" class="ef-stack">
          <h2>Groups</h2>
          <!-- Typed filters, held in the address (SIG-LINK-001, SIG-LINK-008). -->
          <fieldset id="group-filters" class="ef-choice-group">
            <legend>Filter</legend>
            <template data-each="statusFilters" data-key="key">
              <label><input type="checkbox" data-event="filterStatus" data-bind-value="key" data-bind-checked="checked" /> <span data-text="label"></span></label>
            </template>
            <template data-each="modeFilters" data-key="key">
              <label><input type="checkbox" data-event="filterMode" data-bind-value="key" data-bind-checked="checked" /> <span data-text="label"></span></label>
            </template>
            <label>Survey
              <select id="survey-filter" data-event="filterSurvey">
                <template data-each="surveyFilters" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
              </select>
            </label>
          </fieldset>
          <table id="group-list">
            <thead><tr><th>Group</th><th>Survey</th><th>Identity</th><th>Accepted</th><th>State</th></tr></thead>
            <tbody>
              <template data-each="groups" data-key="key">
                <tr>
                  <td><a data-bind-href="href" data-text="key"></a></td>
                  <td data-text="survey"></td><td data-text="mode"></td><td data-text="progress"></td><td data-text="phase"></td>
                </tr>
              </template>
            </tbody>
          </table>

          <template data-if="canCreateGroup">
            <form id="new-group" class="ef-stack" data-event="createGroup">
              <h3>New group</h3>
              <label>Template
                <select data-event="newGroupTemplate">
                  <template data-each="catalog" data-key="hash"><option data-bind-value="hash" data-bind-selected="selected" data-text="label"></option></template>
                </select>
              </label>
              <label><input type="checkbox" data-event="newGroupMode" value="identified" data-bind-checked="newGroupIdentified" /> Identified (one submission per invited instance)</label>
              <label>Expected surveys <input type="number" min="1" data-event="newGroupExpected" data-bind-value="newGroupExpected" /></label>
              <label>Minimum reportable count <input type="number" min="1" data-event="newGroupMinimum" data-bind-value="newGroupMinimum" /></label>
              <button type="submit" class="ef-button" data-bind-disabled="busy">Create group</button>
            </form>
          </template>

        </section>
      </template>

      <template data-if="viewGroupTabs">
        <template data-if="hasGroup">
            <section id="group" class="ef-stack">
              <h2>Group <code id="group-key" data-text="groupKey"></code></h2>
              <p><span data-text="groupProgress"></span> · <span id="group-phase" data-text="groupPhase"></span></p>
              <template data-if="hasWithheld"><p id="withheld" class="ef-alert" role="status" data-tone="attention" data-text="withheldNotice"></p></template>
              <nav aria-label="Group" id="group-tabs">
                <ul class="areas">
                  <li><a id="tab-group" data-bind-href="groupHref" data-bind-aria-current="viewGroup">Overview</a></li>
                  <li><a id="tab-results" data-bind-href="resultsHref" data-bind-aria-current="viewResults">Results</a></li>
                  <li><a id="tab-scoring" data-bind-href="scoringHref" data-bind-aria-current="viewScoring">Scoring</a></li>
                  <li><a id="tab-imports" data-bind-href="importsHref" data-bind-aria-current="viewImports">Imported surveys</a></li>
                  <li><a id="tab-report" data-bind-href="reportHref" data-bind-aria-current="viewReport">Report</a></li>
                </ul>
              </nav>
              <template data-if="viewGroup">
              <section id="group-overview" class="ef-stack">
              <table>
                <thead><tr><th>Section</th><th>Mean</th></tr></thead>
                <tbody><template data-each="sections" data-key="id"><tr><td data-text="id"></td><td data-text="score"></td></tr></template></tbody>
              </table>
              <p>Report state: <code id="report-fragment" data-text="reportFragment"></code></p>
              <div class="ef-stack" id="lifecycle">
                <template data-if="canClose"><button type="button" class="ef-button" data-event="transition" value="close">Close incomplete</button></template>
                <template data-if="canReopen"><button type="button" class="ef-button" data-event="transition" value="reopen">Reopen</button></template>
                <template data-if="canFinalize"><button type="button" class="ef-button" data-event="transition" value="finalize">Finalize</button></template>
                <template data-if="canSeal"><button type="button" class="ef-button" data-event="transition" value="seal">Seal</button></template>
              </div>
              </section>
              </template>
              <template data-if="viewResults">
              <!-- Charts compiled and validated in F# (ADM-015..017): meters for the
                   marks, a symbol beside every colour, and the same data as text. -->
              <section id="exploration" class="ef-stack" aria-label="Exploration">
                <div class="explore-controls">
                  <label><input type="checkbox" data-event="exploreSort" value="value" data-bind-checked="exploreByValue" /> Sort by value</label>
                  <label><input type="checkbox" data-event="exploreDisplay" value="percent" data-bind-checked="explorePercent" /> Distribution as percentages</label>
                  <button type="button" class="ef-button" data-event="exploreSection" value="all">All sections</button>
                </div>
                <figure id="section-chart">
                  <figcaption data-text="chartDescription"></figcaption>
                  <table class="chart">
                    <thead><tr><th>Section</th><th>Mean</th><th>Bar</th></tr></thead>
                    <tbody>
                      <template data-each="chart" data-key="key">
                        <tr data-bind-data-pattern="pattern">
                          <th scope="row"><button type="button" class="ef-button" data-event="exploreSection" data-text="category"></button></th>
                          <td><span aria-hidden="true" data-text="symbol"></span> <span data-text="value"></span></td>
                          <td><meter min="0" max="1" data-bind-value="position" data-bind-hidden="unavailable" data-bind-aria-label="value"></meter></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <p class="chart-warnings" data-text="chartWarnings"></p>
                </figure>
                <template data-if="hasDistribution">
                  <figure id="distribution-chart">
                    <figcaption data-text="distributionDescription"></figcaption>
                    <table class="chart">
                      <thead><tr><th>Scores</th><th>Respondents</th><th>Bar</th></tr></thead>
                      <tbody>
                        <template data-each="distribution" data-key="key">
                          <tr><th scope="row" data-text="category"></th><td data-text="value"></td><td><meter min="0" max="1" data-bind-value="position" data-bind-hidden="unavailable"></meter></td></tr>
                        </template>
                      </tbody>
                    </table>
                  </figure>
                </template>
              </section>
              </template>
              <template data-if="viewScoring">
              <section id="scoring" class="ef-stack" aria-label="Scoring">
                <p>Calculated measures, not the canonical result.</p>
                <ul class="areas" id="scoring-sections">
                  <template data-each="scoringSections" data-key="id"><li><a data-bind-href="href" data-bind-aria-current="current" data-text="id"></a></li></template>
                </ul>
                <table id="scoring-measures">
                  <thead><tr><th>Section</th><th>Measure</th><th>Value</th></tr></thead>
                  <tbody><template data-each="scoringMeasures" data-key="key"><tr><td data-text="section"></td><td data-text="measure"></td><td data-text="value"></td></tr></template></tbody>
                </table>
                <p>Lineage: <code id="lineage" data-text="lineage"></code></p>
              </section>
              </template>
              <template data-if="viewImports">
              <section id="imports" class="ef-stack" aria-label="Imported surveys">
              <template data-if="canInvite">
                <section id="invitations" class="ef-stack" aria-labelledby="invitations-title">
                  <h3 id="invitations-title">Invite respondents</h3>
                  <p class="ef-field__description">Each link is one invitation to this group. The links carry no name or e-mail address; for an identified group, keep your own record of which link went to whom. Signal does not store the links.</p>
                  <label>How many links <input id="invite-count" type="number" min="1" max="500" data-event="inviteCount" data-bind-value="inviteCount" /></label>
                  <label>Language (optional, e.g. fr-CA) <input id="invite-locale" type="text" data-event="inviteLocale" data-bind-value="inviteLocale" /></label>
                  <label>Last day to answer (optional) <input id="invite-expires" type="date" data-event="inviteExpires" data-bind-value="inviteExpires" /></label>
                  <button type="button" class="ef-button" id="issue-invitations" data-event="issueInvitations" data-bind-disabled="busy">Create links</button>
                  <template data-if="hasInvitations">
                    <div class="ef-stack">
                      <p id="invitation-summary" role="status" data-text="invitationSummary"></p>
                      <ol id="invitation-links"><template data-each="invitationLinks" data-key="key"><li><code data-text="link"></code></li></template></ol>
                      <button type="button" class="ef-button" id="save-invitations" data-event="saveInvitations">Save the links</button>
                    </div>
                  </template>
                </section>
              </template>
              <template data-if="canImport">
                <form id="import" class="ef-stack" data-event="import">
                  <label>Completed survey links, one per line
                    <textarea rows="6" data-event="importText" data-bind-value="importText"></textarea>
                  </label>
                  <label><input type="checkbox" data-event="importOrigin" value="file" data-bind-checked="importFile" /> These came from a text file</label>
                  <button type="submit" class="ef-button" data-bind-disabled="busy">Import</button>
                </form>
              </template>

              <fieldset id="outcome-filters" class="ef-choice-group">
                <legend>Show</legend>
                <template data-each="outcomeFilters" data-key="key">
                  <label><input type="checkbox" data-event="filterOutcome" data-bind-value="key" data-bind-checked="checked" /> <span data-text="label"></span></label>
                </template>
              </fieldset>
              <table id="imported-surveys">
                <thead><tr><th>Artifact</th><th>Outcome</th></tr></thead>
                <tbody><template data-each="importedSurveys" data-key="artifact"><tr><td><code data-text="artifact"></code></td><td data-text="outcome"></td></tr></template></tbody>
              </table>
              <section id="last-import" aria-label="Last import">
                <!-- ADM-008's separate views of the last batch, by outcome. -->
                <details id="importPending"><summary>Pending</summary><ul><template data-each="importPending" data-key="artifact"><li><code data-text="artifact"></code> <span data-text="outcome"></span></li></template></ul></details>
                <details id="importAccepted"><summary>Accepted</summary><ul><template data-each="importAccepted" data-key="artifact"><li><code data-text="artifact"></code> <span data-text="outcome"></span></li></template></ul></details>
                <details id="importDuplicate"><summary>Duplicates</summary><ul><template data-each="importDuplicate" data-key="artifact"><li><code data-text="artifact"></code> <span data-text="outcome"></span></li></template></ul></details>
                <details id="importRejected"><summary>Rejected</summary><ul><template data-each="importRejected" data-key="artifact"><li><code data-text="artifact"></code> <span data-text="outcome"></span></li></template></ul></details>
                <details id="importReconciliation"><summary>Requiring reconciliation</summary><ul><template data-each="importReconciliation" data-key="artifact"><li><code data-text="artifact"></code> <span data-text="outcome"></span></li></template></ul></details>
                <details id="importBlockedTemplate"><summary>Blocked by a missing template</summary><ul><template data-each="importBlockedTemplate" data-key="artifact"><li><code data-text="artifact"></code> <span data-text="outcome"></span></li></template></ul></details>
                <details id="importBlockedEncoding"><summary>Blocked by an unsupported encoding</summary><ul><template data-each="importBlockedEncoding" data-key="artifact"><li><code data-text="artifact"></code> <span data-text="outcome"></span></li></template></ul></details>
                <p><strong data-text="batchStatus"></strong> <span data-text="batchCounts"></span></p>
                <table>
                  <thead><tr><th>Artifact</th><th>Outcome</th></tr></thead>
                  <tbody><template data-each="importItems" data-key="artifact"><tr><td><code data-text="artifact"></code></td><td data-text="outcome"></td></tr></template></tbody>
                </table>
              </section>
              </section>
              </template>
            </section>
        </template>
      </template>

      <template data-if="viewCompare">
        <section id="compare" class="ef-stack" aria-labelledby="compare-title">
          <h2 id="compare-title">Compare groups</h2>
          <fieldset id="compare-groups" class="ef-choice-group">
            <legend>Groups</legend>
            <template data-each="compareGroups" data-key="key">
              <label><input type="checkbox" data-event="compareGroup" data-bind-value="key" data-bind-checked="checked" /> <code data-text="key"></code> <span data-text="survey"></span></label>
            </template>
          </fieldset>
          <label>Section
            <select id="compare-section" data-event="compareSection">
              <option value="">All sections</option>
              <template data-each="compareSections" data-key="id"><option data-bind-value="id" data-bind-selected="selected" data-text="id"></option></template>
            </select>
          </label>
          <p id="compare-reason" data-text="compareReason"></p>
          <table id="compare-rows">
            <thead><tr><th>Section</th><th>Group</th><th>Mean</th></tr></thead>
            <tbody><template data-each="compareRows" data-key="key"><tr><td data-text="section"></td><td><code data-text="group"></code></td><td data-text="score"></td></tr></template></tbody>
          </table>
        </section>
      </template>

      <template data-if="viewAdministrators">
        <section id="administrators" class="ef-stack">
          <h2>Administrators</h2>
          <table>
            <thead><tr><th>Account</th><th>Capabilities</th><th></th></tr></thead>
            <tbody>
              <template data-each="administrators" data-key="id">
                <tr>
                  <td data-text="id"></td><td data-text="capabilities"></td>
                  <td><button type="button" class="ef-button" data-event="removeAdministrator" data-bind-disabled="busy">Remove</button></td>
                </tr>
              </template>
            </tbody>
          </table>
          <template data-if="canManageAdministrators">
            <form id="admit" class="ef-stack" data-event="admit">
              <label>GitHub account number <input type="text" inputmode="numeric" data-event="admitAccount" data-bind-value="admitAccount" /></label>
              <label>Grant
                <select data-event="admitGrant">
                  <option value="analyst">Analyst</option>
                  <option value="importer">Importer</option>
                  <option value="draftEditor">Draft editor</option>
                  <option value="reviewer">Reviewer</option>
                  <option value="publisher">Publisher</option>
                  <option value="administrator">Administrator</option>
                </select>
              </label>
              <button type="submit" class="ef-button" data-bind-disabled="busy">Admit</button>
            </form>
          </template>
        </section>
      </template>

      <template data-if="viewStorage">
        <section id="storage" class="ef-stack">
          <h2>Storage</h2>
          <p id="verification" data-text="verification"></p>
          <template data-if="canRepairIndex"><button type="button" class="ef-button" data-event="rebuildIndex">Rebuild the contribution index</button></template>
          <p>Capabilities now: <code id="capabilities" data-text="capabilityList"></code></p>
        </section>
      </template>
    </section>
  </template>

  <!-- A group's report (WI-0062): ReportData from the engine, rendered by
       Folio's print components without recomputation. The family and
       language are the route's, so the link opens this report; printing
       prints only the report (Print, or Save as PDF). -->
  <template data-if="viewReport">
    <section id="report-controls" class="ef-stack report-controls" aria-label="Report options">
      <nav aria-label="Report family">
        <ul class="areas" id="report-families">
          <template data-each="reportFamilies" data-key="id">
            <li><a data-bind-href="href" data-bind-aria-current="current" data-bind-data-available="available" data-text="label"></a></li>
          </template>
        </ul>
      </nav>
      <nav aria-label="Report language">
        <ul class="areas" id="report-locales">
          <template data-each="reportLocales" data-key="id">
            <li><a data-bind-href="href" data-bind-aria-current="current" data-bind-lang="id" data-text="label"></a></li>
          </template>
        </ul>
      </nav>
      <template data-if="reportWithheld">
        <p id="report-withheld" role="status">This report is not available for this group. <span data-text="reportWithheldReason"></span></p>
      </template>
      <p class="ef-field__description">To keep a copy, print this page or save it as PDF: only the report is printed.</p>
      <section id="report-snapshots" class="ef-stack" aria-labelledby="report-snapshots-title">
        <h2 id="report-snapshots-title">Formal snapshots</h2>
        <p class="ef-field__description">A snapshot keeps this report exactly as it is now, with what produced it. Opening it later never shows newer data.</p>
        <template data-if="canTakeSnapshot"><button type="button" class="ef-button" id="take-snapshot" data-event="takeSnapshot" data-bind-disabled="busy">Take a snapshot</button></template>
        <ul id="snapshots">
          <template data-each="reportSnapshots" data-key="key">
            <li>
              <span data-text="label"></span> · <span data-text="intact"></span>
              <template data-if="canExport">
                <button type="button" class="ef-button" data-event="exportSnapshot" value="report.json">Report (JSON)</button>
                <button type="button" class="ef-button" data-event="exportSnapshot" value="sections.csv">Sections (CSV)</button>
                <button type="button" class="ef-button" data-event="exportSnapshot" value="lineage.json">Lineage</button>
              </template>
            </li>
          </template>
        </ul>
      </section>
    </section>
  </template>
  <template data-if="hasReport">
    <template data-if="viewReport">
      <ef-print-document class="report-surface" id="report" data-bind-lang="reportLang" data-bind-dir="reportDir">
        <ef-print-title-page>
          <header>
            <p data-text="reportFamily"></p>
            <h1 id="report-title" data-text="reportTitle"></h1>
            <p><span data-text="reportGroupLabel"></span> <code data-text="reportGroup"></code></p>
            <p><span data-text="reportGeneratedLabel"></span> <span id="report-generated" data-text="reportGenerated"></span> · <span id="report-status" data-text="reportStatus"></span></p>
          </header>
        </ef-print-title-page>
        <ef-print-toc>
          <nav aria-labelledby="report-contents-title">
            <h2 id="report-contents-title" data-text="reportContentsLabel"></h2>
            <ol id="report-contents"><template data-each="reportContents" data-key="key"><li data-text="title"></li></template></ol>
          </nav>
        </ef-print-toc>
        <template data-if="reportHasSummary">
          <ef-print-section><section><h2 data-text="reportTitleSummary"></h2><p id="report-summary" data-text="reportSummary"></p>
            <ul id="report-warnings"><template data-each="reportWarnings" data-key="code"><li data-bind-data-code="code" data-text="text"></li></template></ul></section></ef-print-section>
        </template>
        <template data-if="reportHasResponseCounts">
          <ef-print-section><section><h2 data-text="reportTitleResponseCounts"></h2>
            <dl id="report-counts"><template data-each="reportCounts" data-key="key"><div><dt data-text="label"></dt><dd data-bind-data-count="key" data-text="value"></dd></div></template></dl>
          </section></ef-print-section>
        </template>
        <template data-if="reportHasOverallResult">
          <ef-print-section><section><h2 data-text="reportTitleOverallResult"></h2>
            <ef-print-metric><p id="report-overall" data-text="reportOverall"></p></ef-print-metric></section></ef-print-section>
        </template>
        <template data-if="reportHasSectionResults">
          <ef-print-section><section><h2 data-text="reportTitleSectionResults"></h2>
            <ef-print-table><table id="report-sections">
              <thead><tr><template data-each="reportColumns" data-key="key"><th scope="col" data-text="label"></th></template></tr></thead>
              <tbody><template data-each="reportSections" data-key="key"><tr><th scope="row" data-text="section"></th><td data-text="mean"></td><td data-text="median"></td><td data-text="range"></td><td data-text="scored"></td><td data-text="unscored"></td></tr></template></tbody>
            </table></ef-print-table></section></ef-print-section>
        </template>
        <template data-if="reportHasGroupDistributions">
          <ef-print-section><section><h2 data-text="reportTitleGroupDistributions"></h2>
            <ef-print-table><table id="report-spread">
              <tbody><template data-each="reportSections" data-key="key"><tr><th scope="row" data-text="section"></th><td data-text="median"></td><td data-text="range"></td></tr></template></tbody>
            </table></ef-print-table></section></ef-print-section>
        </template>
        <template data-if="reportHasStrengths">
          <ef-print-section><section><h2 data-text="reportTitleStrengths"></h2><ul><template data-each="reportStrengths" data-key="key"><li data-text="text"></li></template></ul></section></ef-print-section>
        </template>
        <template data-if="reportHasWeaknesses">
          <ef-print-section><section><h2 data-text="reportTitleWeaknesses"></h2><ul><template data-each="reportWeaknesses" data-key="key"><li data-text="text"></li></template></ul></section></ef-print-section>
        </template>
        <template data-if="reportHasRecommendations">
          <ef-print-section><section><h2 data-text="reportTitleRecommendations"></h2>
            <ul id="report-recommendations"><template data-each="reportRecommendations" data-key="key"><li><strong data-text="title"></strong> <span data-text="priority"></span> · <span data-text="frequency"></span></li></template></ul></section></ef-print-section>
        </template>
        <template data-if="reportHasCoverageAndConfidence">
          <ef-print-section><section><h2 data-text="reportTitleCoverageAndConfidence"></h2>
            <dl id="report-coverage"><template data-each="reportCoverage" data-key="key"><div><dt data-text="label"></dt><dd data-text="value"></dd></div></template></dl></section></ef-print-section>
        </template>
        <template data-if="reportHasComparisons">
          <ef-print-section><section><h2 data-text="reportTitleComparisons"></h2>
            <ul id="report-comparisons"><template data-each="reportComparisons" data-key="key"><li><span data-text="label"></span> (<span data-text="baseline"></span>): <span data-text="delta"></span></li></template></ul></section></ef-print-section>
        </template>
        <template data-if="reportHasRoleBreakdown">
          <ef-print-section><section><h2 data-text="reportTitleRoleBreakdown"></h2><ul><template data-each="reportRoles" data-key="key"><li><span data-text="role"></span>: <span data-text="count"></span></li></template></ul></section></ef-print-section>
        </template>
        <template data-if="reportHasMethodology">
          <ef-print-section><section><h2 data-text="reportTitleMethodology"></h2><ul id="report-methodology"><template data-each="reportMethodology" data-key="key"><li data-text="text"></li></template></ul></section></ef-print-section>
        </template>
        <template data-if="reportHasAuditMetadata">
          <ef-print-section><section><h2 data-text="reportTitleAuditMetadata"></h2>
            <dl id="report-audit"><template data-each="reportAudit" data-key="key"><div><dt data-text="label"></dt><dd><code data-text="value"></code></dd></div></template></dl></section></ef-print-section>
        </template>
      </ef-print-document>
    </template>
  </template>
</main>
<script type="module" src="./admin.js"></script>
</body>
</html>
