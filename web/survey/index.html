<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- The survey reads its template from this site only (DF-SIGNAL-2026-0005):
     connect-src stays 'self'. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Signal · Survey</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="../styles.css" />
</head>
<body>
<!-- Structure and presentation only. Every value below is projected by the F#
     engine (GenericSession, SurveyWire) through Limen's data-* bindings, and
     every control sends a named event back to it. The survey itself comes
     from the site's published-templates/ folder, checked against the link
     before it is used. -->
<main class="app ef-stack" data-bind-lang="lang">
  <header class="ef-record-header page-header">
    <div class="ef-record-header__main">
      <div class="ef-record-header__title">
        <div><span class="ef-record-header__type">Signal</span><h1 id="survey-title" data-text="surveyTitle"></h1></div>
      </div>
      <p id="survey-version" data-text="surveyVersion"></p>
    </div>
  </header>

  <template data-if="hasOperationalFault">
    <ef-fault-inline class="ef-component-tag">
      <div class="ef-fault ef-fault--inline operational-fault" id="operational-fault"
           data-ef-intent="inline" data-ef-severity="error" role="alert"
           aria-labelledby="operational-fault-title">
        <div class="ef-fault__marker" aria-hidden="true">!</div>
        <div class="ef-fault__body">
          <p class="ef-fault__severity">Operational error</p>
          <p class="ef-fault__title" id="operational-fault-title"><strong data-text="operationalFaultTitle"></strong></p>
          <p class="ef-fault__message" data-text="operationalFaultMessage"></p>
          <p class="ef-fault-reference">Reference <code data-text="operationalFaultReference"></code></p>
        </div>
      </div>
    </ef-fault-inline>
  </template>

  <!-- A test or preview link (AUT-006 §§21, 60): marked, and never a production submission. -->
  <template data-if="isTest">
    <ef-alert class="ef-component-tag">
      <aside id="test-notice" class="ef-alert" role="note" data-tone="attention">
        <div class="ef-alert__icon" aria-hidden="true">!</div>
        <p id="test-notice-message"><strong>Test link.</strong> This is a test of the survey, not a real response. What you submit here is marked as a test, and a production import refuses it.</p>
      </aside>
    </ef-alert>
  </template>

  <template data-if="loading">
    <p id="loading" role="status">Loading the survey…</p>
  </template>

  <!-- Missing, damaged, altered or different template: refused, never replaced. -->
  <template data-if="refused">
    <ef-alert class="ef-component-tag">
      <aside id="survey-refused" class="ef-alert" role="alert" data-tone="attention">
        <div class="ef-alert__icon" aria-hidden="true">!</div>
        <p id="survey-refused-message" data-text="refusal"></p>
      </aside>
    </ef-alert>
  </template>

  <template data-if="hasUrlNotice">
    <ef-alert class="ef-component-tag">
      <aside id="url-notice" class="ef-alert" role="status" data-tone="attention">
        <div class="ef-alert__icon" aria-hidden="true">!</div>
        <p id="url-notice-message" data-text="urlNotice"></p>
      </aside>
    </ef-alert>
  </template>

  <template data-if="answering">
    <section id="questions" class="ef-stack" aria-labelledby="questions-title">
      <h2 id="questions-title">Questions</h2>
      <p id="link-disclosure" class="ef-field__description">This page's address contains your answers, so you can come back to them. Anyone you give the address to can see them; it is never sent to a server.</p>
      <template data-if="hasProgress">
        <p id="progress" role="status" data-text="progress"></p>
      </template>
      <template data-if="reviewing">
        <p id="review-notice" role="status">Check your answers. Submit them, or go back to change them.</p>
      </template>
      <template data-if="hasTimer">
        <p id="timer-notice" role="status" data-text="timerNotice"></p>
      </template>
      <template data-if="hasPages">
        <p id="page-label" data-text="pageLabel"></p>
      </template>
      <div id="survey-rows" class="ef-stack">
        <template data-each="rows" data-key="id">
          <div class="survey-row" data-bind-data-row="id">
            <h3 class="survey-section" data-bind-hidden="hideSection" data-text="title"></h3>
            <p class="survey-question" data-bind-hidden="hideQuestion" data-bind-id="promptId" data-bind-data-component="component" data-bind-data-variant="variant"><span class="survey-number" data-bind-hidden="hideQuestionNumber" data-text="questionNumber"></span> <strong data-text="prompt" data-bind-aria-hidden="promptHidden"></strong><span class="ef-sr-only" data-bind-hidden="hideAccessibleName" data-text="accessibleName"></span> <span class="survey-optional" data-text="optionalMark"></span> <span class="ef-field__description" data-text="help"></span></p>
            <p class="ef-sr-only" data-bind-hidden="hideAccessibleDescription" data-bind-id="descriptionId" data-text="accessibleDescription"></p>
            <p class="survey-error" data-bind-hidden="hideError" data-bind-id="errorId" data-text="error"></p>
            <p class="ef-selection-status" role="status" data-bind-hidden="hideSelectionStatus" data-text="selectionStatus"></p>
            <div class="survey-review" data-bind-hidden="hideReview">
              <p class="survey-review-prompt"><span data-bind-hidden="hideQuestionNumber" data-text="questionNumber"></span> <span data-text="prompt"></span></p>
              <p class="survey-review-answer" data-text="answerText"></p>
            </div>
            <label class="ef-special-choice" data-bind-hidden="hideOption">
              <input type="radio" data-event="answered" data-bind-aria-describedby="describedBy" data-bind-aria-required="required" data-bind-aria-invalid="invalid" data-bind-name="group" data-bind-checked="checked" data-bind-disabled="locked" />
              <span data-text="label"></span>
            </label>
            <label class="ef-special-choice" data-bind-hidden="hideToggle">
              <input type="checkbox" data-event="toggled" data-bind-aria-describedby="describedBy" data-bind-aria-required="required" data-bind-aria-invalid="invalid" data-bind-checked="checked" data-bind-disabled="locked" />
              <span data-text="label"></span>
            </label>
            <label class="ef-field" data-bind-hidden="hideNumber">
              <span class="ef-field__label" data-text="label"></span>
              <input type="number" inputmode="decimal" data-event="numbered" data-bind-aria-describedby="describedBy" data-bind-aria-required="required" data-bind-aria-invalid="invalid" data-bind-value="numberValue" data-bind-min="numberMin" data-bind-max="numberMax" data-bind-step="numberStep" data-bind-disabled="locked" />
            </label>
            <div class="ef-cluster" data-bind-hidden="hidePair">
              <span data-text="label"></span>
              <label><input type="radio" data-event="pickedBest" data-bind-aria-describedby="describedBy" data-bind-aria-required="required" data-bind-aria-invalid="invalid" data-bind-name="groupBest" data-bind-checked="bestChecked" data-bind-disabled="locked" /> Fits best</label>
              <label><input type="radio" data-event="pickedWorst" data-bind-aria-describedby="describedBy" data-bind-aria-required="required" data-bind-aria-invalid="invalid" data-bind-name="groupWorst" data-bind-checked="worstChecked" data-bind-disabled="locked" /> Fits least</label>
            </div>
          </div>
        </template>
      </div>
      <template data-if="hasRefusal">
        <ef-alert class="ef-component-tag">
          <aside id="submit-refusal" class="ef-alert" role="alert" data-tone="attention">
            <div class="ef-alert__icon" aria-hidden="true">!</div>
            <p id="submit-refusal-message" data-text="submitRefusal"></p>
          </aside>
        </ef-alert>
      </template>
      <div class="ef-cluster">
        <template data-if="canBack">
          <button id="page-back" type="button" data-event="pageBack">Back</button>
        </template>
        <template data-if="hasNext">
          <button id="page-next" type="button" data-event="pageNext">Next</button>
        </template>
        <template data-if="reviewing">
          <button id="review-back" type="button" data-event="reviewClosed">Change answers</button>
        </template>
        <template data-if="isLastPage">
          <button id="submit-answers" type="button" data-event="submitRequested" data-text="submitLabel"></button>
        </template>
      </div>
    </section>
  </template>

  <template data-if="submitted">
    <section id="submitted" class="ef-stack" aria-labelledby="submitted-title">
      <h2 id="submitted-title">Submitted</h2>
      <p id="submission-disclosure">Your answers are final. This link contains them; send it to the person who invited you.</p>
      <label class="ef-field">
        <span class="ef-field__label">Submission link</span>
        <input id="submission-link" type="text" readonly data-bind-value="submissionLink" />
      </label>
      <div class="ef-cluster">
        <button id="copy-link" type="button" data-event="copyRequested">Copy link</button>
      </div>
      <template data-if="hasCopyNotice">
        <p id="copy-notice" role="status" data-text="copyNotice"></p>
      </template>
    </section>
  </template>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
